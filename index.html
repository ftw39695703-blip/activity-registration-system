<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light">
<title>福委會活動報名 Event Registration</title>
<style>
  :root {
    --green: #06c755;
    --green-dark: #04a344;
    --green-soft: #e8f8ee;
    --text: #1f2328;
    --muted: #5f6b76;
    --line: #e3e7eb;
    --bg: #f4f6f8;
    --card: #ffffff;
    --danger: #c62828;
    --danger-soft: #fdecea;
    --radius: 14px;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font: 16px/1.6 -apple-system, BlinkMacSystemFont, "PingFang TC", "Noto Sans TC", "Microsoft JhengHei", sans-serif;
    -webkit-text-size-adjust: 100%;
  }
  #app {
    max-width: 480px;
    margin: 0 auto;
    padding: 16px 16px calc(32px + env(safe-area-inset-bottom));
  }
  h1, h2 { margin: 0; line-height: 1.35; }
  h1 { font-size: 22px; }
  h2 { font-size: 20px; }
  p { margin: 0; }

  /* 中英並列：英文用較小、較淡的字，顏色跟著所在的元素 */
  .en { font-size: .82em; font-weight: 400; opacity: .75; }
  .en-block { display: block; }
  .en-inline { margin-left: .4em; }

  .card {
    background: var(--card);
    border-radius: var(--radius);
    padding: 20px;
    box-shadow: 0 1px 3px rgba(0, 0, 0, .06);
    margin-bottom: 16px;
  }
  .center { text-align: center; }
  .muted { color: var(--muted); }
  .page-title { margin: 4px 0 16px; }

  /* 活動資訊 */
  .eyebrow { color: var(--green-dark); font-size: 13px; font-weight: 600; letter-spacing: .05em; }
  .event h1 { margin: 2px 0 12px; }
  .meta { display: grid; grid-template-columns: auto 1fr; gap: 4px 14px; margin: 0; font-size: 15px; }
  .meta dt { color: var(--muted); }
  .meta dd { margin: 0; word-break: break-word; }
  .divider { border: 0; border-top: 1px solid var(--line); margin: 18px 0; }

  /* 表單 */
  .field { display: block; margin-bottom: 16px; }
  .label { display: block; font-weight: 600; font-size: 15px; margin-bottom: 6px; }
  input, select {
    width: 100%;
    font: inherit;
    font-size: 16px; /* 避免 iOS 自動放大 */
    color: var(--text);
    background: #fff;
    border: 1px solid #cfd6dc;
    border-radius: 10px;
    padding: 12px 14px;
    min-height: 48px;
    -webkit-appearance: none;
    appearance: none;
  }
  select {
    background-image: linear-gradient(45deg, transparent 50%, var(--muted) 50%), linear-gradient(135deg, var(--muted) 50%, transparent 50%);
    background-position: calc(100% - 20px) 21px, calc(100% - 15px) 21px;
    background-size: 5px 5px;
    background-repeat: no-repeat;
    padding-right: 36px;
  }
  input:focus, select:focus { outline: 2px solid var(--green); outline-offset: 1px; border-color: var(--green); }
  .choices { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .choice {
    font: inherit;
    font-weight: 600;
    line-height: 1.3;
    padding: 6px 8px;
    min-height: 52px;
    border-radius: 10px;
    border: 2px solid #cfd6dc;
    background: #fff;
    color: var(--text);
    cursor: pointer;
  }
  .choice[aria-pressed="true"] { border-color: var(--green); background: var(--green-soft); color: var(--green-dark); }

  .btn {
    display: block;
    width: 100%;
    font: inherit;
    font-weight: 700;
    font-size: 17px;
    line-height: 1.3;
    padding: 8px 12px;
    min-height: 52px;
    border: 0;
    border-radius: 12px;
    background: var(--green);
    color: #fff;
    cursor: pointer;
    margin-top: 8px;
  }
  .btn:active { background: var(--green-dark); }
  .btn:disabled { opacity: .55; cursor: default; }
  .btn-ghost { background: transparent; color: var(--danger); border: 1px solid #e6b8b8; font-weight: 600; font-size: 16px; }
  .btn-ghost:active { background: var(--danger-soft); }

  .error { background: var(--danger-soft); color: var(--danger); border-radius: 10px; padding: 10px 12px; margin-bottom: 12px; font-size: 15px; }
  .banner { background: var(--green-soft); color: var(--green-dark); font-weight: 700; border-radius: 12px; padding: 12px 16px; margin-bottom: 16px; text-align: center; }

  /* 報到碼 */
  .qr-wrap { text-align: center; margin: 18px 0 4px; }
  .qr { display: inline-block; background: #fff; padding: 14px; border-radius: 12px; border: 1px solid var(--line); }
  .qr img, .qr canvas { display: block; width: 220px; height: 220px; }
  .ticket-id { font: 600 20px/1.4 ui-monospace, "SF Mono", Menlo, monospace; letter-spacing: .12em; margin-top: 8px; }
  .badge { display: inline-block; background: var(--green-soft); color: var(--green-dark); font-weight: 700; border-radius: 999px; padding: 4px 14px; margin-top: 6px; }
  .hint { color: var(--muted); font-size: 14px; margin-top: 14px; }

  /* 載入中 */
  .loading { padding-top: 30vh; }
  .spinner { width: 36px; height: 36px; margin: 0 auto 12px; border: 3px solid var(--line); border-top-color: var(--green); border-radius: 50%; animation: spin .8s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .message { margin-top: 18vh; }
  .message p { margin-top: 10px; }
</style>
</head>
<body>
<main id="app" aria-live="polite"></main>

<script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script>
// ===== 設定區（部署前填好這兩項）=====
const CONFIG = {
  LIFF_ID: '2012073957-8sDedmQq',
  API_URL: 'https://script.google.com/macros/s/AKfycbzqqM0Cw6uvVfNhoV-QqonSxBiZtS7AsQ8wnrdJDmjtbscg_4LSo7mSjcsJS-McAKpG/exec',
};

// ===== 中英文字 =====
// 固定介面中英並列；活動名稱、地點、單位照試算表的內容顯示
const T = {
  loading: ['載入中…', 'Loading…'],
  busy: ['系統忙碌中，請稍後再試', 'The system is busy. Please try again later.'],
  failed: ['無法完成', 'Something went wrong'],
  reload: ['重新整理', 'Reload'],
  eyebrow: ['福委會活動', 'Welfare Committee Event'],
  date: ['日期', 'Date'],
  place: ['地點', 'Location'],
  deadline: ['報名截止', 'Deadline'],
  unit: ['單位', 'Department'],
  empId: ['工號', 'Employee ID'],
  name: ['姓名', 'Name'],
  meal: ['餐點', 'Meal'],
  selectUnit: ['請選擇單位', 'Select department'],
  empIdHint: ['請輸入工號', 'Employee ID'],
  nameHint: ['請輸入姓名（全名）', 'Full name'],
  needUnit: ['請選擇單位', 'Please select your department.'],
  needEmpId: ['請輸入工號', 'Please enter your employee ID.'],
  needName: ['請輸入姓名', 'Please enter your name.'],
  needMeal: ['請選擇葷食或素食', 'Please choose non-vegetarian or vegetarian.'],
  submit: ['送出報名', 'Submit'],
  submitting: ['送出中…', 'Submitting…'],
  closedTitle: ['報名已截止', 'Registration closed'],
  closedBody: name => [`「${name}」已截止報名，如有疑問請聯絡福委會。`,
    `Registration for "${name}" has closed. Please contact the Welfare Committee if you have any questions.`],
  cannotRegister: ['無法報名', 'Unable to register'],
  registered: ['✅ 報名成功！', 'You are registered!'],
  reopenHint: ['之後可隨時從官方 LINE 選單「我的報到碼」再次開啟。',
    'You can open this again anytime from "My check-in codes" in the official LINE menu.'],
  qrLabel: id => [`報到 QR Code，編號 ${id}`, `Check-in QR code, number ${id}`],
  checkedIn: ['已完成報到', 'Checked in'],
  showQrHint: ['報到時請將螢幕亮度調高，出示此 QR Code 給工作人員掃描。',
    'At check-in, turn up your screen brightness and show this QR code to the staff.'],
  pastDeadline: ['已過報名截止時間，如需取消請聯絡福委會。',
    'The deadline has passed. To cancel, please contact the Welfare Committee.'],
  cancel: ['取消報名', 'Cancel registration'],
  cancelling: ['取消中…', 'Cancelling…'],
  cancelConfirm: name => [`確定要取消「${name}」的報名嗎？\n取消後此 QR Code 會失效；截止前仍可重新報名。`,
    `Cancel your registration for "${name}"?\nThis QR code will stop working. You can register again before the deadline.`],
  cancelled: ['已取消報名', 'Your registration has been cancelled.'],
  cancelFailed: ['取消失敗，請稍後再試', 'Could not cancel. Please try again later.'],
  myTickets: ['我的報到碼', 'My check-in codes'],
  noTickets: ['目前沒有報名中的活動', 'You have no active registrations'],
  noTicketsBody: ['收到福委會的活動通知後，點通知中的報名連結即可報名。',
    'When you receive an event notice from the Welfare Committee, tap the registration link in it.'],
  cannotOpen: ['無法開啟頁面', 'Unable to open this page'],
  cannotOpenBody: ['請從福委會官方 LINE 的連結開啟此頁面。',
    "Please open this page from the link in the Welfare Committee's official LINE account."],
  loadFailed: ['頁面載入失敗', 'Failed to load the page'],
  loadFailedBody: ['請確認網路連線後重新開啟。', 'Please check your internet connection and open this page again.'],
};

// 後端回傳的錯誤訊息是中文；英文依錯誤代碼對照（CANCEL_ 開頭的是取消報名時用的）
const EN_ERRORS = {
  NETWORK: 'Network error. Please check your connection and try again.',
  SERVER: 'The system is busy. Please try again later.',
  BUSY: 'Many people are registering right now. Please try again in a moment.',
  AUTH: 'Your login has expired. Please close this page and open it again.',
  INVALID: 'Please fill in all fields.',
  ROSTER: 'Your employee ID, name, or department does not match the employee list. Please check and try again.',
  NO_EVENT: 'This event was not found or is not open for registration yet.',
  CLOSED: 'Registration has closed.',
  CANCEL_CLOSED: 'The registration deadline has passed, so it cannot be cancelled. Please contact the Welfare Committee.',
  DUP_USER: 'You have already registered for this event.',
  DUP_EMP: 'This employee ID has already been registered. Please contact the Welfare Committee if you have any questions.',
  NOT_FOUND: 'Your registration could not be found.',
  CHECKED_IN: 'You have already checked in, so the registration cannot be cancelled.',
  BAD_REQUEST: 'Unknown request.',
};

function errText(err, context, fallback) {
  const t = fallback || T.busy;
  return [err.message || t[0], EN_ERRORS[(context || '') + err.code] || EN_ERRORS[err.code] || t[1]];
}

const MEALS = [
  { value: '葷', label: ['葷食', 'Non-vegetarian'] },
  { value: '素', label: ['素食', 'Vegetarian'] },
];
const RETRYABLE = ['NETWORK', 'SERVER', 'BUSY'];

const app = document.getElementById('app');
const params = new URLSearchParams(location.search);

// ===== 畫面工具 =====
function h(tag, props, ...children) {
  const el = document.createElement(tag);
  for (const [k, v] of Object.entries(props || {})) {
    if (v == null || v === false) continue;
    if (k === 'class') el.className = v;
    else if (k.startsWith('on')) el.addEventListener(k.slice(2), v);
    else el.setAttribute(k, v === true ? '' : v);
  }
  for (const c of children.flat(Infinity)) {
    if (c == null || c === false || c === '') continue;
    el.append(c instanceof Node ? c : String(c));
  }
  return el;
}

function render(...nodes) {
  app.replaceChildren(...nodes.flat().filter(Boolean));
  window.scrollTo(0, 0);
}

// 中英並列：t 是 [中文, 英文]；block 為 true 時英文換行顯示
function bi(t, block) {
  return [t[0], h('span', { class: `en ${block ? 'en-block' : 'en-inline'}`, lang: 'en' }, t[1])];
}

// placeholder、確認視窗等只能放純文字的地方
function plain(t, sep) {
  return t[0] + (sep || ' / ') + t[1];
}

function showLoading() {
  render(h('div', { class: 'loading center' }, h('div', { class: 'spinner' }), h('p', { class: 'muted' }, bi(T.loading))));
}

function showMessage(title, body, action) {
  render(h('section', { class: 'card center message' },
    h('h2', null, bi(title, true)),
    body && h('p', { class: 'muted' }, bi(body, true)),
    action && h('button', { class: 'btn', onclick: action.onClick }, bi(action.label, true))));
}

function showError(err, retry) {
  const canRetry = retry && RETRYABLE.includes(err.code);
  showMessage(T.failed, errText(err), canRetry && { label: T.reload, onClick: retry });
}

// ===== 呼叫後端 =====
class ApiError extends Error {
  constructor(code, message) {
    super(message);
    this.code = code;
  }
}

async function api(action, payload) {
  let res;
  try {
    // 用 text/plain 避免瀏覽器送出 CORS 預檢請求（Apps Script 不支援）
    res = await fetch(CONFIG.API_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify(Object.assign({ action, idToken: liff.getIDToken() }, payload)),
    });
  } catch (e) {
    throw new ApiError('NETWORK', '網路連線失敗，請確認網路後再試');
  }

  let data;
  try {
    data = await res.json();
  } catch (e) {
    throw new ApiError('SERVER', '系統暫時無法回應，請稍後再試');
  }

  if (!data.ok) {
    if (data.code === 'AUTH') return relogin();
    throw new ApiError(data.code, data.message);
  }
  sessionSet('relogin', '');
  return data;
}

// 登入過期：LINE 外的瀏覽器重新登入一次；LINE 內請使用者重新開啟
function relogin() {
  if (!liff.isInClient() && sessionGet('relogin') !== '1') {
    sessionSet('relogin', '1');
    liff.logout();
    liff.login({ redirectUri: location.href });
    return new Promise(() => {}); // 等待頁面跳轉
  }
  throw new ApiError('AUTH', '登入已過期，請關閉此頁面後重新開啟');
}

function sessionGet(k) {
  try { return sessionStorage.getItem(k); } catch (e) { return null; }
}
function sessionSet(k, v) {
  try { v ? sessionStorage.setItem(k, v) : sessionStorage.removeItem(k); } catch (e) { /* 無痕模式等情況忽略 */ }
}

// ===== 共用元件 =====
function eventHeader(ev) {
  return h('header', { class: 'event' },
    h('p', { class: 'eyebrow' }, bi(T.eyebrow)),
    h('h1', null, ev.name),
    h('dl', { class: 'meta' },
      ev.date && [h('dt', null, bi(T.date, true)), h('dd', null, ev.date)],
      ev.place && [h('dt', null, bi(T.place, true)), h('dd', null, ev.place)],
      ev.deadline && [h('dt', null, bi(T.deadline, true)), h('dd', null, ev.deadline)]));
}

function field(label, control) {
  return h('label', { class: 'field' }, h('span', { class: 'label' }, bi(label)), control);
}

function mealLabel(value) {
  return (MEALS.find(m => m.value === value) || MEALS[0]).label;
}

// ===== 活動報名頁 =====
async function loadEvent(eventId) {
  showLoading();
  try {
    const d = await api('init', { eventId });
    if (d.registration) return renderTicketPage(d.event, d.registration, false);
    if (d.event.canRegister) return renderForm(d.event, d.units);
    showMessage(T.closedTitle, T.closedBody(d.event.name));
  } catch (err) {
    showError(err, () => loadEvent(eventId));
  }
}

function renderForm(ev, units) {
  let meal = '';

  const unitSel = h('select', { name: 'unit' },
    h('option', { value: '' }, plain(T.selectUnit)),
    units.map(u => h('option', { value: u }, u)));
  const empInput = h('input', { name: 'empId', autocomplete: 'off', autocapitalize: 'characters', spellcheck: 'false', placeholder: plain(T.empIdHint) });
  const nameInput = h('input', { name: 'name', autocomplete: 'name', placeholder: plain(T.nameHint) });
  const mealBtns = MEALS.map(m => h('button', {
    type: 'button',
    class: 'choice',
    'aria-pressed': 'false',
    onclick: () => {
      meal = m.value;
      mealBtns.forEach((b, i) => b.setAttribute('aria-pressed', String(MEALS[i].value === meal)));
    },
  }, bi(m.label, true)));

  const errBox = h('p', { class: 'error', role: 'alert', hidden: true });
  const submit = h('button', { type: 'submit', class: 'btn' }, bi(T.submit, true));

  const showFormError = t => {
    errBox.replaceChildren(...bi(t, true));
    errBox.hidden = false;
    errBox.scrollIntoView({ block: 'center', behavior: 'smooth' });
  };

  const onSubmit = async e => {
    e.preventDefault();
    const data = { unit: unitSel.value, empId: empInput.value.trim(), name: nameInput.value.trim(), meal };
    const missing = !data.unit ? T.needUnit
      : !data.empId ? T.needEmpId
      : !data.name ? T.needName
      : !data.meal ? T.needMeal
      : null;
    if (missing) return showFormError(missing);

    errBox.hidden = true;
    submit.disabled = true;
    submit.replaceChildren(...bi(T.submitting, true));
    try {
      const d = await api('register', Object.assign({ eventId: ev.id }, data));
      renderTicketPage(d.event, d.registration, true);
    } catch (err) {
      if (err.code === 'DUP_USER') return loadEvent(ev.id);
      if (err.code === 'CLOSED' || err.code === 'NO_EVENT') return showMessage(T.cannotRegister, errText(err));
      showFormError(errText(err));
      submit.disabled = false;
      submit.replaceChildren(...bi(T.submit, true));
    }
  };

  render(h('form', { class: 'card', novalidate: true, onsubmit: onSubmit },
    eventHeader(ev),
    h('hr', { class: 'divider' }),
    field(T.unit, unitSel),
    field(T.empId, empInput),
    field(T.name, nameInput),
    h('div', { class: 'field' },
      h('span', { class: 'label', id: 'meal-label' }, bi(T.meal)),
      h('div', { class: 'choices', role: 'group', 'aria-labelledby': 'meal-label' }, mealBtns)),
    errBox,
    submit));
}

// ===== 報到碼 =====
function renderTicketPage(ev, reg, justRegistered) {
  render(
    justRegistered && h('div', { class: 'banner', role: 'status' }, bi(T.registered, true)),
    ticketCard(ev, reg, () => loadEvent(ev.id)),
    h('p', { class: 'hint center' }, bi(T.reopenHint, true)));
}

function ticketCard(ev, reg, afterCancel) {
  const qrBox = h('div', { class: 'qr', role: 'img', 'aria-label': plain(T.qrLabel(reg.ticketId)) });
  new QRCode(qrBox, { text: reg.ticketId, width: 440, height: 440, correctLevel: QRCode.CorrectLevel.M });

  let footer = null;
  if (!reg.checkedIn && ev.canCancel) {
    footer = h('button', { class: 'btn btn-ghost', onclick: e => cancelRegistration(ev, e.currentTarget, afterCancel) }, bi(T.cancel, true));
  } else if (!reg.checkedIn) {
    footer = h('p', { class: 'hint' }, bi(T.pastDeadline, true));
  }

  return h('section', { class: 'card' },
    eventHeader(ev),
    h('div', { class: 'qr-wrap' },
      qrBox,
      h('p', { class: 'ticket-id' }, reg.ticketId),
      reg.checkedIn && h('span', { class: 'badge' }, bi(T.checkedIn))),
    h('hr', { class: 'divider' }),
    h('dl', { class: 'meta' },
      h('dt', null, bi(T.name, true)), h('dd', null, reg.name),
      h('dt', null, bi(T.unit, true)), h('dd', null, reg.unit),
      h('dt', null, bi(T.empId, true)), h('dd', null, reg.empId),
      h('dt', null, bi(T.meal, true)), h('dd', null, bi(mealLabel(reg.meal)))),
    !reg.checkedIn && h('p', { class: 'hint' }, bi(T.showQrHint, true)),
    footer);
}

async function cancelRegistration(ev, btn, afterCancel) {
  if (!confirm(plain(T.cancelConfirm(ev.name), '\n\n'))) return;
  btn.disabled = true;
  btn.replaceChildren(...bi(T.cancelling, true));
  try {
    await api('cancel', { eventId: ev.id });
    alert(plain(T.cancelled, '\n'));
    afterCancel();
  } catch (err) {
    alert(plain(errText(err, 'CANCEL_', T.cancelFailed), '\n'));
    btn.disabled = false;
    btn.replaceChildren(...bi(T.cancel, true));
  }
}

// ===== 我的報到碼 =====
async function loadTickets() {
  showLoading();
  try {
    const d = await api('tickets');
    if (!d.tickets.length) {
      return showMessage(T.noTickets, T.noTicketsBody);
    }
    render(
      h('h1', { class: 'page-title' }, bi(T.myTickets, true)),
      d.tickets.map(t => ticketCard(t.event, t.registration, loadTickets)));
  } catch (err) {
    showError(err, loadTickets);
  }
}

// ===== 進入點 =====
async function main() {
  showLoading();
  try {
    await liff.init({ liffId: CONFIG.LIFF_ID });
  } catch (e) {
    return showMessage(T.cannotOpen, T.cannotOpenBody);
  }
  // 從 liff.line.me 開啟時，LIFF 會再轉址一次並帶上真正的網址參數
  if (params.has('liff.state')) return;
  if (!liff.isLoggedIn()) {
    liff.login({ redirectUri: location.href });
    return;
  }
  const eventId = params.get('event');
  if (eventId) loadEvent(eventId);
  else loadTickets();
}

if (typeof liff === 'undefined' || typeof QRCode === 'undefined') {
  showMessage(T.loadFailed, T.loadFailedBody);
} else {
  main();
}
</script>
</body>
</html>
